# ros2_control controllers the residual node talks to. Load with the robot's
# ros2_control_node once the URDF has a <ros2_control> tag using dynamixel_hardware_interface.
# Joint names are placeholders: rozart_description/urdf/robot.urdf is still empty.
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz; faster than the policy so the hardware loop never starves.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: position_controllers/JointGroupPositionController

position_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3

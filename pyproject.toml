[project]
name = "rozart-ws"
version = "0.1.0"
description = "Workspace for the Rozart robot arm."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "catkin-pkg>=1.1.1",
    "empy==3.3.4",
    "hand-rl",
    "lark>=1.3.1",
]

[tool.uv.sources]
hand-rl = { git = "https://github.com/rice-robotics-club/hand-rl" }

[dependency-groups]
dev = [
    "colcon-common-extensions>=0.3.0",
    "colcon-mixin>=0.3.2",
]
